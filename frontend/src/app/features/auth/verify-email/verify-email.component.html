<div class="auth-form">
  <h1>Подтверждение email</h1>
  <p>
    Отправили ссылку для подтверждения почты на<br />
    <strong>{{ email }}</strong
    ><br />
    Перейдите по ней, чтобы завершить регистрацию
  </p>

  <div class="auth-switch">
    Не пришёл код?
    <button
      mat-button
      type="button"
      (click)="resendCode()"
      [disabled]="isResending()"
    >
      {{ isResending() ? 'Отправляем...' : 'Отправить ещё раз' }}
    </button>
  </div>
</div>
