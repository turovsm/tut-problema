<div class="auth-dialog">
  <button
    mat-icon-button
    class="auth-dialog__close"
    type="button"
    (click)="close()"
  >
    <mat-icon>close</mat-icon>
  </button>

  @if (mode() === 'login') {
    <app-login-form
      (success)="closeAfterSuccess()"
      (goToRegister)="switchToRegister()"
    ></app-login-form>
  } @else {
    <app-register-form
      (success)="closeAfterSuccess()"
      (goToLogin)="switchToLogin()"
    ></app-register-form>
  }
</div>
