name: Frontend CI

on:
  push:
    branches:
      - main
      - dev
      - frontend
      - 'feature/frontend/**'
      - 'feature/devops/**'
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-ci.yml'
  pull_request:
    branches:
      - main
      - dev
      - frontend
    paths:
      - 'frontend/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-format:
    name: Lint and Prettier
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: frontend/.nx/cache
          key: ${{ runner.os }}-nx-lint-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-lint-
            ${{ runner.os }}-nx-

      - name: Check Prettier Formatting
        run: npx nx format:check

      - name: Run ESLint
        run: npx nx lint frontend

  unit-test:
    name: Unit Tests (Jest)
    runs-on: ubuntu-latest
    needs: lint-and-format
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: frontend/.nx/cache
          key: ${{ runner.os }}-nx-test-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-test-
            ${{ runner.os }}-nx-

      - name: Run Jest Tests
        run: npx nx test frontend --configuration=ci --codeCoverage

      - name: Upload Coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: frontend/coverage/frontend/

  build:
    name: Build Production
    runs-on: ubuntu-latest
    needs: lint-and-format
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: frontend/.nx/cache
          key: ${{ runner.os }}-nx-build-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-build-
            ${{ runner.os }}-nx-

      - name: Build Application
        run: npx nx build frontend --configuration=production

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: ./frontend
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm ls @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps

      - name: Install Playwright System Deps
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps

      - name: Cache Nx
        uses: actions/cache@v4
        with:
          path: frontend/.nx/cache
          key: ${{ runner.os }}-nx-e2e-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nx-e2e-
            ${{ runner.os }}-nx-

      - name: Run E2E Tests
        run: npx nx e2e e2e
        env:
          BASE_URL: http://localhost:4200

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/dist/.playwright/e2e/playwright-report/
          retention-days: 30